# ==========================================
# AI Career Portal - Application Properties
# ==========================================

# Server
server.port=8080
spring.application.name=ai-career-portal

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:career_portal.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# File Upload (profile photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
app.upload.dir=uploads/photos

# OpenRouter API (OpenAI-compatible - consumed via Spring AI's OpenAI client)
# Spring AI's OpenAiApi appends /v1/chat/completions to this base URL itself.
app.openrouter.base-url=https://openrouter.ai/api
app.openrouter.model=google/gemini-2.0-flash-exp:free

# Required by spring-ai-openai-spring-boot-starter's autoconfiguration at startup.
# The real key is stored in Admin -> System Settings and used dynamically per-call
# in OpenRouterService; this placeholder just satisfies the autoconfig health check.
spring.ai.openai.api-key=placeholder

# Logging
logging.level.com.careerportal=INFO
logging.level.org.hibernate=WARN
